apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone-ingress
spec:
  rules:
    - host: student18.32.189.172.33.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: crm-api-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-ui-service
                port:
                  number: 80
