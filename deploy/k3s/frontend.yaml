apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-ui
  template:
    metadata:
      labels:
        app: crm-ui
    spec:
      containers:
        - name: crm-ui
          image: ghcr.io/toobatux-org/capstone-crm/crm-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: crm-ui-service
  namespace: student18
spec:
  selector:
    app: crm-ui
  ports:
    - port: 80
      targetPort: 80