spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: crm-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${SPRING_DATASOURCE_USERNAME:crm}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  security:
    jwt:
        secret: ${SPRING_SECURITY_JWT_SECRET:change-me}
        expiration: ${SPRING_SECURITY_JWT_EXPIRATION:3600000}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: crm-interaction-consumer
      auto-offset-reset: earliest
app:
  admin:
    username: ${CRM_ADMIN_USERNAME:}
    email: ${CRM_ADMIN_EMAIL:}
    password: ${CRM_ADMIN_PASSWORD:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.northstar.crm: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG