# Deploys image digests produced by "Capstone Images" onto k3s. Never rebuilds.
name: Capstone CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, test, stage, prod]
      api_digest:
        description: "crm-api digest (sha256:...) from Capstone Images run summary"
        required: true
      ui_digest:
        description: "crm-ui digest (sha256:...) from Capstone Images run summary"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: \${{ inputs.environment }} # stage/prod wait for reviewer approval
    env:
      REGISTRY_PATH: ghcr.io/toobatux-org/capstone-crm
      NAMESPACE: student18
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p "\$HOME/.kube"
          echo "\({{ secrets.KUBECONFIG }}" \vert{} base64 -d > "\)HOME/.kube/config"
          chmod 600 "\$HOME/.kube/config"

      - name: Apply cluster secrets
        env:
          SPRING_SECURITY_JWT_SECRET: \${{ secrets.SPRING_SECURITY_JWT_SECRET }}
          CRM_ADMIN_USERNAME: \${{ secrets.CRM_ADMIN_USERNAME }}
          CRM_ADMIN_PASSWORD: \${{ secrets.CRM_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: \${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl create secret generic crm-backend-secrets \
            --from-literal=SPRING_SECURITY_JWT_SECRET="\$SPRING_SECURITY_JWT_SECRET" \
            --from-literal=CRM_ADMIN_USERNAME="\$CRM_ADMIN_USERNAME" \
            --from-literal=CRM_ADMIN_PASSWORD="\$CRM_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -n \$NAMESPACE -f -
          kubectl create secret generic postgres-secret \
            --from-literal=POSTGRES_USER=myuser \
            --from-literal=POSTGRES_DB=mydb \
            --from-literal=POSTGRES_PASSWORD="\$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -n \$NAMESPACE -f -

      - name: Deploy to cluster
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k3s/ -n \$NAMESPACE
          kubectl set image deployment/crm-api \
            crm-api="\$REGISTRY_PATH/crm-api@\({{ inputs.api_digest }}" -n \)NAMESPACE
          kubectl set image deployment/crm-ui \
            crm-ui="\$REGISTRY_PATH/crm-ui@\({{ inputs.ui_digest }}" -n \)NAMESPACE
          kubectl rollout status deployment/crm-api --timeout=180s -n \$NAMESPACE
          kubectl rollout status deployment/crm-ui --timeout=180s -n \$NAMESPACE

      - name: Smoke test CUS-1001
        env:
          SMOKE_USERNAME: \${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: \${{ secrets.SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl delete pod smoke-crm -n \$NAMESPACE --ignore-not-found
          kubectl run smoke-crm -n \$NAMESPACE --restart=Never --image=curlimages/curl:8.11.1 --command -- sleep 90
          kubectl wait -n \$NAMESPACE --for=condition=Ready pod/smoke-crm --timeout=90s
          FRONT_IP=\((kubectl get pod -n\)NAMESPACE -l app=crm-ui -o jsonpath='{.items[0].status.podIP}')
          
          # Testing container direct endpoint over port 8080 (Unprivileged NGINX configuration)
          kubectl exec smoke-crm -n \(NAMESPACE -- curl -fsS -o /dev/null -w "UI \%{http_code}\n" "http://\)FRONT_IP:8080/"
          
          # Routing API auth sequence over internal Cluster IP boundaries
          TOKEN=\((kubectl exec smoke-crm -n\)NAMESPACE -- curl -fsS -X POST "http://crm-api-service:8080/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"\(SMOKE_USERNAME\",\"password\":\"\)SMOKE_PASSWORD\"}" | jq -r .token)
          
          echo "::add-mask::\$TOKEN"
          
          kubectl exec smoke-crm -n \$NAMESPACE -- curl -fsS -w "\nAPI %{http_code}\n" \
            -H "Authorization: Bearer \$TOKEN" \
            -H "X-Correlation-ID: lab-request-001" \
            "http://crm-api-service:8080/api/v1/interactions?customerId=CUS-1001"
          
          kubectl delete pod smoke-crm -n \$NAMESPACE --ignore-not-found

      - name: Record what was deployed
        if: always()
        run: |
          {
            echo "### Deployed to k3s namespace \`$NAMESPACE\`"
            echo "- crm-api: \`$REGISTRY_PATH/crm-api@${{ inputs.api_digest }}\`"
            echo "- crm-ui: \`$REGISTRY_PATH/crm-ui@${{ inputs.ui_digest }}\`"
            echo "- Rollback: \`kubectl rollout undo deployment/crm-api -n $NAMESPACE\`"
          } >> "\$GITHUB_STEP_SUMMARY"
