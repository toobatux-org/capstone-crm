<header>
  <div class="header-bar">
  <div class="brand">
    <img src="/images/nslogo.png" alt="" />
    <h1><strong>Northstar CRM</strong></h1>
  </div>
  @if (session.isSignedIn()) {
    <nav>
      <a
        routerLink="/customers"
        routerLinkActive="active-nav-link"
        [routerLinkActiveOptions]="exactMatch"
        ariaCurrentWhenActive="page"
      >Customers</a>
      <div class="account">
        <div
          class="agent-card"
          data-testid="current-agent"
          [attr.aria-label]="'Signed in as ' + session.username() + ', ' + roleLabel()"
        >
          <span class="agent-avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="agent-meta">
            <span class="agent-name">{{ session.username() }}</span>
            <span class="agent-role">{{ roleLabel() }}</span>
          </span>
        </div>
        <button class="logout-button" type="button" (click)="openLogoutConfirmation(logoutDialog)">Log out</button>
      </div>
    </nav>
  }
  </div>
</header>
<main>
  <router-outlet />
</main>
<dialog #logoutDialog class="logout-dialog" aria-labelledby="logout-dialog-title" aria-describedby="logout-dialog-description">
  <h2 id="logout-dialog-title">Log out?</h2>
  <p id="logout-dialog-description">Are you sure you want to end your session?</p>
  <div class="logout-dialog-actions">
    <button class="cancel-button" type="button" autofocus (click)="logoutDialog.close()">Cancel</button>
    <button class="confirm-button" type="button" (click)="logout(logoutDialog)">Log out</button>
  </div>
</dialog>
