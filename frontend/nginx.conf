server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Send API calls to the crm-api Service (no CORS needed)
  location /api/ {
    proxy_pass http://crm-api-service:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular routes: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
